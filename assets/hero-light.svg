<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="David Estevez, mathematician and software developer">
  <defs>
    <pattern id="gridl" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e3dcc9" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f0e3"/>
      <stop offset="1" stop-color="#efe9d9"/>
    </linearGradient>
    <linearGradient id="curvel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f8fa3" stop-opacity="0"/>
      <stop offset=".35" stop-color="#0f8fa3" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0f8fa3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#fadel)"/>
  <rect width="1200" height="300" fill="url(#gridl)" opacity=".7"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#ddd4bf" stroke-width="1"/>

  <g opacity=".95">
    <path d="M690 232 C 772 232, 792 96, 872 96 S 972 232, 1052 232 1152 210 1152 210"
          fill="none" stroke="url(#curvel)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="690" y1="232" x2="1150" y2="232" stroke="#cfc6ae" stroke-width="1"/>
    <circle cx="872" cy="96" r="4.5" fill="#f5f0e3" stroke="#0f8fa3" stroke-width="2"/>
    <g stroke="#8fb0b8" stroke-width="1.4" fill="none">
      <path d="M754 232 L 872 96 L 1008 232"/>
      <path d="M754 232 L 1008 232"/>
    </g>
    <g fill="#f5f0e3" stroke="#0f8fa3" stroke-width="1.6">
      <circle cx="754" cy="232" r="5"/>
      <circle cx="1008" cy="232" r="5"/>
    </g>
  </g>

  <rect x="1150" y="252" width="11" height="11" fill="none" stroke="#0f8fa3" stroke-width="1.6"/>

  <text x="64" y="86" fill="#0f8fa3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="3">// mathematician who builds</text>
  <text x="62" y="158" fill="#17212b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.2">David Est&#233;vez</text>
  <rect x="66" y="176" width="52" height="3" fill="#0f8fa3"/>
  <text x="64" y="212" fill="#4c5768" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21">Algorithms, craft, and systems worth building.</text>
  <text x="64" y="250" fill="#8a8570" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5">first principles, from proof to production</text>
</svg>

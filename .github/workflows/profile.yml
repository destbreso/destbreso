name: Generate Profile

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare output dir
        run: mkdir -p dist

      # ── Start from the last published snapshot: a generator that fails today writes
      #    nothing, so its file from the day before is deployed again instead of vanishing
      #    from the README (the deploy replaces the whole branch). ─────────────────────
      - name: Restore the last snapshot
        run: |
          if git fetch --depth=1 origin output; then
            git archive FETCH_HEAD | tar -x -C dist
            # only what is still generated: a retired figure is not carried on for ever
            find dist -type f ! -name data.json ! -name series.json ! -name year.svg ! -name year-light.svg -delete
          fi

      # ── Analyst-page data snapshot. Runs FIRST because it also writes
      #    dist/series.json, the private-inclusive daily commit series the
      #    year SVG below is drawn from, so every commit view agrees.
      #    PAT_TOKEN is optional: set it (a PAT with repo scope) to include
      #    PRIVATE repos everywhere. Without it, everything uses public repos.
      - name: Generate data snapshot (data.json + series.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python .github/scripts/generate-data.py

      # ── The year as threads, a project each, dark and light (reads dist/series.json) ──
      - name: Generate the year SVGs
        run: python .github/scripts/generate-year.py

      # ── Push generated artifacts to the output branch ────────────
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

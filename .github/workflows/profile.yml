name: Generate Profile

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare output dir
        run: mkdir -p dist

      # ── The signature: the year as one signal (Fourier waveform +
      #    the same year folded onto a Hilbert curve, on ONE shared
      #    timeline so both pulses stay perfectly in sync) ───────────
      - name: Generate signal SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python .github/scripts/generate-signal.py

      # ── The year as a landscape: marching-squares contour map ────
      - name: Generate contours SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python .github/scripts/generate-contours.py

      # ── Analyst-page data snapshot ───────────────────────────────
      # PAT_TOKEN is optional: set it (a PAT with repo scope) to include PRIVATE
      # repos in the day x hour rhythm. Without it, the rhythm uses public repos.
      - name: Generate data snapshot (data.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python .github/scripts/generate-data.py

      # ── Push generated artifacts to the output branch ────────────
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
